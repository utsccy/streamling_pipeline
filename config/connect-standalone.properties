# Standalone Kafka Connect worker for the Datagen source and file sink connectors.
bootstrap.servers=localhost:9092
listeners=http://0.0.0.0:8083
rest.advertised.host.name=localhost
group.id=streamling-connect-standalone

# Local offset storage is required in standalone mode.
offset.storage.file.filename=./data/connect.offsets
offset.flush.interval.ms=10000

# Keep defaults simple; connector-level converters override these where needed.
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.storage.StringConverter
internal.key.converter=org.apache.kafka.connect.json.JsonConverter
internal.value.converter=org.apache.kafka.connect.json.JsonConverter
internal.key.converter.schemas.enable=false
internal.value.converter.schemas.enable=false

# Include Confluent Hub plugins and bundled demo connectors.
plugin.path=/usr/share/java,/usr/share/confluent-hub-components,/usr/share/filestream-connectors

consumer.auto.offset.reset=earliest

