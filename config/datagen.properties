# Confluent Datagen source connector.
name=input-events-datagen
connector.class=io.confluent.kafka.connect.datagen.DatagenConnector
tasks.max=1
kafka.topic=input-events
max.interval=100
iterations=-1

# The generated message key becomes the Kafka key.
schema.keyfield=user_id
schema.string={\
  "type":"record",\
  "name":"InputEvent",\
  "namespace":"com.streamling.pipeline",\
  "fields":[\
    {"name":"event_id","type":{"type":"string","arg.properties":{"regex":"evt_[0-9]{10}"}}},\
    {"name":"user_id","type":{"type":"string","arg.properties":{"regex":"user_[0-9]{5}"}}},\
    {"name":"event_type","type":{"type":"string","arg.properties":{"options":["PURCHASE","REFUND","ADD_TO_CART","LOGIN","LOGOUT"]}}},\
    {"name":"merchant","type":{"type":"string","arg.properties":{"options":["Acme Market","Northwind Traders","Globex Online","Initech Store","Soylent Shop"]}}},\
    {"name":"amount","type":{"type":"double","arg.properties":{"range":{"min":5,"max":500}}}},\
    {"name":"currency","type":{"type":"string","arg.properties":{"options":["USD","CAD"]}}},\
    {"name":"channel","type":{"type":"string","arg.properties":{"options":["web","ios","android","store"]}}},\
    {"name":"region","type":{"type":"string","arg.properties":{"options":["us-east","us-west","ca-central"]}}},\
    {"name":"status","type":{"type":"string","arg.properties":{"options":["APPROVED","PENDING","FAILED"]}}},\
    {"name":"card_type","type":{"type":"string","arg.properties":{"options":["visa","mastercard","amex","debit"]}}},\
    {"name":"loyalty_tier","type":{"type":"string","arg.properties":{"options":["bronze","silver","gold","platinum"]}}}\
  ]\
}

# Emit JSON records so the Streams app can parse plain JSON strings.
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

# Continue on individual record failures and log the details.
errors.tolerance=all
errors.log.enable=true
errors.log.include.messages=true

